# Requires `uv` on PATH (backend hooks) and `pnpm` for the optional frontend hook.
# Install once with:  pre-commit install
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^frontend/next-env\.d\.ts$

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        types_or: [python]
        files: ^backend/
        pass_filenames: false

      - id: ruff-format
        name: ruff-format (backend)
        entry: uv run --directory backend ruff format
        language: system
        types_or: [python]
        files: ^backend/
        pass_filenames: false

      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy
        language: system
        types_or: [python]
        files: ^backend/(src|tests)/
        pass_filenames: false

      - id: import-linter
        name: import-linter (quant boundary)
        entry: uv run --directory backend lint-imports
        language: system
        files: ^backend/
        pass_filenames: false
