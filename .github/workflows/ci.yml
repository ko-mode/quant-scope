name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantscope
          POSTGRES_PASSWORD: quantscope
          POSTGRES_DB: quantscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUANTSCOPE_TEST_DATABASE_URL: postgresql+psycopg://quantscope:quantscope@localhost:5432/quantscope_test
      QUANTSCOPE_DATABASE_URL: postgresql+psycopg://quantscope:quantscope@localhost:5432/quantscope_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python + dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Import boundaries (import-linter)
        run: uv run lint-imports

      - name: Alembic migrate / check / roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose configuration
        run: docker compose config --quiet
